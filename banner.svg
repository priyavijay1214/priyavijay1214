<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ec4899" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="1" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="2" y="2" width="1196" height="316" rx="22"/></clipPath>
    <style>
      .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
      .sans { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .flow { stroke-dasharray: 6 10; animation: dash 1.6s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -32; } }
      .blink { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
      @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0b0f1a"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow1)"/>
    <rect width="1200" height="320" fill="url(#glow2)"/>
  </g>
  <rect x="2" y="2" width="1196" height="316" rx="22" fill="none" stroke="url(#edge)" stroke-width="2"/>

  <!-- left: identity -->
  <text x="68" y="92" class="mono" font-size="17" fill="#a5b4fc">~/priya $ whoami<tspan class="blink" fill="#f472b6"> ▍</tspan></text>
  <text x="66" y="162" class="sans" font-size="60" font-weight="800" fill="url(#brand)" letter-spacing="-1">priya vijaya basker</text>
  <text x="68" y="198" class="mono" font-size="16" fill="#94a3b8">data science + statistics · ut austin</text>

  <g class="mono" font-size="15" font-weight="600">
    <rect x="68" y="228" width="150" height="36" rx="18" fill="#6366f1" fill-opacity="0.14" stroke="#818cf8"/>
    <text x="143" y="251" text-anchor="middle" fill="#c7d2fe">data scientist</text>
    <rect x="230" y="228" width="150" height="36" rx="18" fill="#a855f7" fill-opacity="0.14" stroke="#c084fc"/>
    <text x="305" y="251" text-anchor="middle" fill="#e9d5ff">data engineer</text>
    <rect x="392" y="228" width="160" height="36" rx="18" fill="#ec4899" fill-opacity="0.14" stroke="#f472b6"/>
    <text x="472" y="251" text-anchor="middle" fill="#fbcfe8">ai/ml engineer</text>
  </g>

  <!-- right: raw -> pipeline -> model -->
  <g>
    <!-- raw data -->
    <g fill="#64748b">
      <circle cx="782" cy="120" r="4"/><circle cx="806" cy="146" r="3.5"/><circle cx="770" cy="160" r="3"/>
      <circle cx="798" cy="182" r="4"/><circle cx="776" cy="204" r="3.5"/><circle cx="812" cy="212" r="3"/>
      <circle cx="790" cy="236" r="4"/><circle cx="820" cy="118" r="3"/><circle cx="764" cy="134" r="3"/>
      <circle cx="822" cy="178" r="3.5"/><circle cx="760" cy="226" r="3"/>
    </g>
    <text x="790" y="280" class="mono" font-size="13" fill="#64748b" text-anchor="middle">raw</text>

    <!-- flows in -->
    <path d="M834 150 C 870 150, 870 178, 902 178" fill="none" stroke="#818cf8" stroke-width="2" class="flow"/>
    <path d="M834 210 C 870 210, 870 182, 902 182" fill="none" stroke="#818cf8" stroke-width="2" class="flow"/>

    <!-- pipeline box -->
    <rect x="904" y="146" width="104" height="68" rx="12" fill="#a855f7" fill-opacity="0.12" stroke="#c084fc" stroke-width="1.5"/>
    <text x="956" y="174" class="mono" font-size="12.5" fill="#e9d5ff" text-anchor="middle">sql · dbt</text>
    <text x="956" y="194" class="mono" font-size="12.5" fill="#e9d5ff" text-anchor="middle">spark</text>
    <text x="956" y="280" class="mono" font-size="13" fill="#a78bfa" text-anchor="middle">pipeline</text>

    <!-- flows out -->
    <path d="M1010 172 C 1040 172, 1040 132, 1070 132" fill="none" stroke="#f472b6" stroke-width="2" class="flow"/>
    <path d="M1010 180 C 1040 180, 1040 180, 1070 180" fill="none" stroke="#f472b6" stroke-width="2" class="flow"/>
    <path d="M1010 188 C 1040 188, 1040 228, 1070 228" fill="none" stroke="#f472b6" stroke-width="2" class="flow"/>

    <!-- modeled clusters -->
    <g class="pulse">
      <circle cx="1094" cy="126" r="5" fill="#818cf8"/><circle cx="1110" cy="136" r="4" fill="#818cf8"/><circle cx="1100" cy="142" r="3.5" fill="#818cf8"/><circle cx="1118" cy="122" r="3.5" fill="#818cf8"/>
    </g>
    <g class="pulse" style="animation-delay:.8s">
      <circle cx="1096" cy="178" r="5" fill="#c084fc"/><circle cx="1114" cy="184" r="4" fill="#c084fc"/><circle cx="1104" cy="192" r="3.5" fill="#c084fc"/><circle cx="1122" cy="172" r="3.5" fill="#c084fc"/>
    </g>
    <g class="pulse" style="animation-delay:1.6s">
      <circle cx="1094" cy="228" r="5" fill="#f472b6"/><circle cx="1112" cy="236" r="4" fill="#f472b6"/><circle cx="1102" cy="220" r="3.5" fill="#f472b6"/><circle cx="1120" cy="228" r="3.5" fill="#f472b6"/>
    </g>
    <text x="1106" y="280" class="mono" font-size="13" fill="#f9a8d4" text-anchor="middle">model</text>
  </g>
</svg>
